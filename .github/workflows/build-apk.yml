name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android e aplicar manifest
        run: |
          flutter create --org br.com.informaticasaojose --project-name jotalle --platforms android .
          cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: jotalle-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
