name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar projeto Android e aplicar manifest
        run: |
          flutter create --org br.com.informaticasaojose --project-name jotalle --platforms android .
          cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r android-overrides/res/. android/app/src/main/res/   # ícone do J da Jotalle

      - run: flutter pub get

      - name: Desativar lint do release (quebra o build em alguns plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sem-lint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze') || t.name.startsWith('lintReport')) {
                t.enabled = false
              }
            }
          }
          GRADLE

      - name: Build APK
        run: flutter build apk --release --dart-define=GOOGLE_MAPS_KEY=${{ secrets.GOOGLE_MAPS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: jotalle-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
