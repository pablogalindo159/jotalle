server {
    listen 80;
    server_name jotalle.infosaojose.com.br;
    root /var/www/jotalle/backend/public;
    index index.php;

    client_max_body_size 40M;   # fotos e PDFs

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
