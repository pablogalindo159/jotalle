<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061a38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jotalle">
<link rel="manifest" href="/pwa/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<link rel="icon" href="/pwa/icon-192.png">
<link rel="stylesheet" href="/pwa/style.css">
<title>Jotalle</title>
</head>
<body>

<!-- INÍCIO -->
<section id="home" class="view">
  <img class="logo" src="/img/logo.png" alt="Jotalle Transportes">
  <button class="grande b-foto" id="goFoto"><span class="ic">📷</span>FOTO</button>
  <button class="grande b-doc" id="goDoc"><span class="ic">📄</span>DIGITALIZAR<br>DOCUMENTO</button>
  <div class="pend hidden" id="pend"></div>
</section>

<!-- FOTO -->
<section id="foto" class="view hidden">
  <div class="topo"><button data-voltar>‹ Voltar</button></div>
  <h1>Foto</h1>
  <label class="l" for="motorista">Motorista</label>
  <input id="motorista" type="text" maxlength="60" autocomplete="off" autocapitalize="characters" placeholder="NOME DO MOTORISTA">
  <label class="l" for="placa">Placa do cavalo (caminhão)</label>
  <input id="placa" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABC1D23">
  <label class="l" for="carreta">Placa da carreta</label>
  <input id="carreta" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="XYZ9K87">

  <label class="chk"><input type="checkbox" id="fMapa" checked> Incluir mapa da localização na foto</label>
  <div class="slots">
    <div class="slot" id="slotP">📷<br>Foto principal<button class="x hidden" id="xP">✕</button></div>
    <div class="slot" id="slotE">+ Foto extra<br>(opcional)<button class="x hidden" id="xE">✕</button></div>
    <div class="slot hidden" id="slotL">+ Foto extra 2<br>(opcional)<button class="x hidden" id="xL">✕</button></div>
  </div>
  <input type="file" id="inP" accept="image/*" capture="environment" hidden>
  <input type="file" id="inE" accept="image/*" capture="environment" hidden>
  <input type="file" id="inL" accept="image/*" capture="environment" hidden>

  <div class="msg hidden" id="fMsg"></div>
  <button class="btn" id="fGerar" disabled>Gerar e enviar</button>
  <img class="prev hidden" id="fPrev" alt="">
  <button class="btn hidden" id="fSalvar" style="background:#25D366">Enviar pelo WhatsApp</button>
</section>

<!-- DOCUMENTO -->
<section id="doc" class="view hidden">
  <div class="topo"><button data-voltar>‹ Voltar</button></div>
  <h1>Digitalizar documento</h1>
  <label class="l" for="dMotorista">Motorista (opcional)</label>
  <input id="dMotorista" type="text" maxlength="60" autocomplete="off" autocapitalize="characters" placeholder="NOME DO MOTORISTA">
  <label class="l" for="dPlaca">Placa do cavalo (opcional)</label>
  <input id="dPlaca" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABC1D23">
  <label class="chk"><input type="checkbox" id="dPb" checked> Modo documento (preto e branco, mais nítido)</label>
  <input type="file" id="inD" accept="image/*" capture="environment" hidden>
  <button class="btn sec" id="dAdd">📷 Fotografar página</button>
  <div class="pags" id="dPags"></div>
  <div class="msg hidden" id="dMsg"></div>
  <button class="btn" id="dGerar" disabled>Gerar PDF e enviar</button>
  <a class="btn sec hidden" id="dAbrir" style="display:block;text-align:center;text-decoration:none" target="_blank">Abrir / baixar PDF</a>
  <button class="btn hidden" id="dComp" style="background:#25D366">Enviar pelo WhatsApp</button>
</section>

<script src="/pwa/app.js"></script>
</body>
</html>
